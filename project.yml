name: MDViewer
options:
  bundleIdPrefix: com.michidevelop
  deploymentTarget: {iOS: "17.0"}
  xcodeVersion: "26.2"
settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    GENERATE_INFOPLIST_FILE: YES
targets:
  MDViewer:
    type: application
    platform: iOS
    sources: [MDViewer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michidevelop.MDViewer
        INFOPLIST_KEY_CFBundleDisplayName: MDViewer
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
  MDViewerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [MDViewerTests]
    dependencies: [{target: MDViewer}]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.michidevelop.MDViewerTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  MDViewer:
    build:
      targets: {MDViewer: all, MDViewerTests: [test]}
    test:
      targets: [MDViewerTests]

